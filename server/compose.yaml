name: homelab_server

x_authentik_env: &authentik_env
  # Database Settings
  AUTHENTIK_POSTGRESQL__HOST: authentik_postgresql
  AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
  AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}

  # Secret Key
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}

  # SMTP Settings
  AUTHENTIK_EMAIL__HOST: ${SMTP_HOST}
  AUTHENTIK_EMAIL__PORT: ${SMTP_PORT}
  AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME}
  AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD}
  AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS}
  AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL}
  AUTHENTIK_EMAIL__TIMEOUT: 30
  AUTHENTIK_EMAIL__FROM: Authentik <no-reply@${DOMAIN}>

x_penpot_flags: &penpot_flags
  PENPOT_FLAGS: enable-smtp enable-login-with-oidc enable-oidc-registration disable-login-with-password disable-registration disable-email-verification

x_penpot_public_uri: &penpot_public_uri
  PENPOT_PUBLIC_URI: https://penpot.${DOMAIN}

x_penpot_http_body_size: &penpot_http_body_size
  # Max body size (30MiB); Used for plain requests, should never be greater than multi-part size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 31457280
  # Max multipart body size (350MiB)
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x_penpot_secret_key: &penpot_secret_key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}

services:
  #################################################################################
  # Traefik
  #################################################################################
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.http.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - --entrypoints.websecure.http.tls.domains[0].main=internal.${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.internal.${DOMAIN}
      - --certificatesresolvers.le-staging.acme.dnschallenge=true
      - --certificatesresolvers.le-staging.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le-staging.acme.email=${TRAEFIK_LE_EMAIL}
      - --certificatesresolvers.le-staging.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le-staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=${TRAEFIK_LE_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=INFO
    environment:
      CF_DNS_API_TOKEN: ${TRAEFIK_CF_DNS_API_TOKEN}
    ports:
      - 80:80/tcp
      - 443:443/tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates_data:/letsencrypt
    networks:
      - traefik_net
      - adguard_home_ingress
      - authentik_ingress
      - open_webui_ingress
      - penpot_ingress
      - code_runner_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.internal.${DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.middlewares=authentik_auth@docker

  #################################################################################
  # AdGuard Home
  #################################################################################
  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION}
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      # - 3000:3000/tcp # uncomment for initial setup
    volumes:
      - adguard_work_data:/opt/adguardhome/work
      - adguard_conf_data:/opt/adguardhome/conf
    networks:
      - adguard_home_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.rule=Host(`adguard.home.${DOMAIN}`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.services.adguard.loadbalancer.server.port=80
      - traefik.docker.network=adguard_home_ingress

  #################################################################################
  # Authentik
  #################################################################################
  authentik_server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    restart: unless-stopped
    command: server
    depends_on:
      authentik_postgresql:
        condition: service_healthy
    environment:
      <<: [*authentik_env]
    volumes:
      - authentik_media_data:/media
      - authentik_custom_templates_data:/templates
    networks:
      - authentik_net
      - authentik_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.authentik.tls.domains[0].main=auth.${DOMAIN}
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      - traefik.docker.network=authentik_ingress
      - traefik.http.middlewares.authentik_auth.forwardauth.address=http://authentik_server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik_auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik_auth.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version

  authentik_worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    restart: unless-stopped
    user: root
    command: worker
    depends_on:
      authentik_postgresql:
        condition: service_healthy
    environment:
      <<: [*authentik_env]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media_data:/media
      - authentik_custom_templates_data:/templates
      - authentik_certs_data:/certs
    networks:
      - authentik_net

  authentik_postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_PG_DB}
      POSTGRES_USER: ${AUTHENTIK_PG_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
    volumes:
      - authentik_db_data:/var/lib/postgresql/data
    networks:
      - authentik_net
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s

  #################################################################################
  # Ollama
  #################################################################################
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  #################################################################################
  # Open WebUI
  #################################################################################
  open_webui:
    image: ghcr.io/open-webui/open-webui:${VERSION}
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_URL: https://openwebui.${DOMAIN}
      ENABLE_SIGNUP: false
      ENABLE_LOGIN_FORM: false
      ENABLE_PASSWORD_AUTH: false
      ENABLE_OAUTH_SIGNUP: true
      OAUTH_PROVIDER_NAME: Authentik
      OAUTH_CLIENT_ID: ${OPENWEBUI_OAUTH_ID}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OAUTH_SECRET}
      OPENID_PROVIDER_URL: https://auth.${DOMAIN}/application/o/${OPENWEBUI_OAUTH_SLUG}/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://openwebui.${DOMAIN}/oauth/oidc/callback
      OAUTH_SCOPES: openid email profile open_webui_roles
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      OAUTH_ROLES_CLAIM: open_webui_roles
      OAUTH_ADMIN_ROLES: open-webui-admins
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ollama_net
      - open_webui_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.open_webui.rule=Host(`openwebui.${DOMAIN}`)
      - traefik.http.routers.open_webui.entrypoints=websecure
      - traefik.http.routers.open_webui.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.open_webui.tls.domains[0].main=openwebui.${DOMAIN}
      - traefik.http.services.open_webui.loadbalancer.server.port=8080
      - traefik.docker.network=open_webui_ingress
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  #################################################################################
  # Penpot
  #################################################################################
  penpot_frontend:
    image: penpotapp/frontend:${PENPOT_VERSION}
    restart: unless-stopped
    depends_on:
      - penpot_backend
      - penpot_exporter
    environment:
      <<: [*penpot_flags, *penpot_http_body_size]
    volumes:
      - penpot_assets_data:/opt/data/assets
    networks:
      - penpot_net
      - penpot_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.penpot.rule=Host(`penpot.${DOMAIN}`)
      - traefik.http.routers.penpot.entrypoints=websecure
      - traefik.http.routers.penpot.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.penpot.tls.domains[0].main=penpot.${DOMAIN}
      - traefik.http.services.penpot.loadbalancer.server.port=8080
      - traefik.docker.network=penpot_ingress

  penpot_backend:
    image: penpotapp/backend:${PENPOT_VERSION}
    restart: unless-stopped
    depends_on:
      penpot_postgres:
        condition: service_healthy
      penpot_valkey:
        condition: service_healthy
    environment:
      <<: [*penpot_flags, *penpot_public_uri, *penpot_http_body_size, *penpot_secret_key]
      PENPOT_DATABASE_URI: postgresql://penpot_postgres/${PENPOT_PG_DB}
      PENPOT_DATABASE_USERNAME: ${PENPOT_PG_USER}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_PG_PASS}
      PENPOT_REDIS_URI: redis://penpot_valkey/0
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_SMTP_DEFAULT_FROM: Penpot <penpot@${DOMAIN}>
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${ORG_NAME} Support <support@${DOMAIN}>
      PENPOT_SMTP_HOST: ${SMTP_HOST}
      PENPOT_SMTP_PORT: ${SMTP_PORT}
      PENPOT_SMTP_USERNAME: ${SMTP_USERNAME}
      PENPOT_SMTP_PASSWORD: ${SMTP_PASSWORD}
      PENPOT_SMTP_TLS: ${SMTP_USE_TLS}
      PENPOT_SMTP_SSL: ${SMTP_USE_SSL}
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_ID}
      PENPOT_OIDC_CLIENT_SECRET: ${PENPOT_OIDC_SECRET}
      PENPOT_OIDC_BASE_URI: https://auth.${DOMAIN}/application/o/${PENPOT_OIDC_SLUG}/
    volumes:
      - penpot_assets_data:/opt/data/assets
    networks:
      - penpot_net

  penpot_exporter:
    image: penpotapp/exporter:${PENPOT_VERSION}
    restart: unless-stopped
    depends_on:
      penpot_valkey:
        condition: service_healthy
    environment:
      <<: [*penpot_secret_key]
      PENPOT_PUBLIC_URI: http://penpot_frontend:8080
      PENPOT_REDIS_URI: redis://penpot_valkey/0
    networks:
      - penpot_net

  penpot_postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: ${PENPOT_PG_DB}
      POSTGRES_USER: ${PENPOT_PG_USER}
      POSTGRES_PASSWORD: ${PENPOT_PG_PASS}
    volumes:
      - penpot_db_data:/var/lib/postgresql/data
    networks:
      - penpot_net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s

  penpot_valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    networks:
      - penpot_net
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli ping | grep PONG
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s

  #################################################################################
  # Code Runner
  #################################################################################
  code_runner:
    image: huakesh/code-runner:${CODERUNNER_VERSION}
    restart: unless-stopped
    environment:
      API_TOKEN: ${CODERUNNER_API_TOKEN}
    networks:
      - code_runner_net
      - code_runner_ingress
    labels:
      - traefik.enable=true
      - traefik.http.routers.code_runner.rule=Host(`code-runner.${DOMAIN}`)
      - traefik.http.routers.code_runner.entrypoints=websecure
      - traefik.http.routers.code_runner.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.code_runner.tls.domains[0].main=code-runner.${DOMAIN}
      - traefik.http.services.code_runner.loadbalancer.server.port=8080
      - traefik.docker.network=code_runner_ingress

  #################################################################################
  # Lichobi
  #################################################################################
  lichobi:
    image: huakesh/lichobi:${LICHOBI_VERSION}
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${LICHOBI_AI_PROVIDER}
      AI_API_KEY: ${LICHOBI_AI_API_KEY}
      CODE_RUNNER_API_BASE_URL: http://code_runner:8080
      CODE_RUNNER_API_TOKEN: ${CODERUNNER_API_TOKEN}
      DEFAULT_PREFIX: !
      DISCORD_BOT_TOKEN: ${LICHOBI_DISCORD_BOT_TOKEN}
      LOG_LEVEL: info
    networks:
      - code_runner_net

volumes:
  traefik_certificates_data:
  adguard_work_data:
  adguard_conf_data:
  authentik_media_data:
  authentik_custom_templates_data:
  authentik_certs_data:
  authentik_db_data:
  ollama_data:
  open_webui_data:
  penpot_assets_data:
  penpot_db_data:

networks:
  traefik_net:
  adguard_home_ingress:
    name: adguard_home_ingress
  authentik_net:
  authentik_ingress:
    name: authentik_ingress
  ollama_net:
  open_webui_ingress:
    name: open_webui_ingress
  penpot_net:
  penpot_ingress:
    name: penpot_ingress
  code_runner_net:
  code_runner_ingress:
    name: code_runner_ingress
