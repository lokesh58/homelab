services:
  lichobi:
    image: docker.io/huakesh/lichobi:0.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${PUID}:${PGID}"
    environment:
      AI_PROVIDER: gemini
      AI_API_KEY: ${LICHOBI_GEMINI_API_KEY}
      CODE_RUNNER_API_BASE_URL: http://code_runner:8080
      CODE_RUNNER_API_TOKEN: ${CODERUNNER_API_TOKEN}
      DEFAULT_PREFIX: !
      DISCORD_BOT_TOKEN: ${LICHOBI_DISCORD_BOT_TOKEN}
      LOG_LEVEL: info
    networks:
      - lichobi_private_net
      - code_runner_public_net

networks:
  lichobi_private_net:
    internal: false
