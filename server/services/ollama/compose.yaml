services:
  ollama:
    image: docker.io/ollama/ollama:${OLLAMA_VERSION}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama_net
      - ollama_ingress
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:

networks:
  ollama_net:
    internal: false
  ollama_ingress:
    internal: true
