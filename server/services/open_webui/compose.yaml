services:
  open_webui:
    image: ghcr.io/open-webui/open-webui:v0.8.10-cuda
    restart: unless-stopped
    depends_on:
      open_webui_db:
        condition: service_healthy
      open_webui_pgvector:
        condition: service_healthy
      open_webui_valkey:
        condition: service_healthy
    environment:
      WEBUI_URL: https://open-webui.server.${DOMAIN}
      ENABLE_SIGNUP: false
      ENABLE_LOGIN_FORM: false
      ENABLE_PASSWORD_AUTH: false
      ENABLE_CHANNELS: true
      ENABLE_FOLDERS: true
      ENABLE_NOTES: true
      ENABLE_MEMORIES: true
      ENABLE_ADMIN_EXPORT: false
      ENABLE_ADMIN_CHAT_ACCESS: false
      ENABLE_PERSISTENT_CONFIG: false
      ENABLE_OLLAMA_API: true
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_CODE_EXECUTION: true
      CODE_EXECUTION_ENGINE: pyodide
      ENABLE_CODE_INTERPRETER: true
      CODE_INTERPRETER_ENGINE: pyodide
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_SESSION_COOKIE_SECURE: true
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${OPENWEBUI_PGVECTOR_USER}:${OPENWEBUI_PGVECTOR_PASS}@open_webui_pgvector:5432/${OPENWEBUI_PGVECTOR_DB}
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_ENGINE: tavily
      TAVILY_API_KEY: ${OPENWEBUI_TAVILY_API_KEY}
      WHISPER_MULTILINGUAL: true
      ENABLE_OAUTH_SIGNUP: true
      ENABLE_OAUTH_PERSISTENT_CONFIG: false
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
      OAUTH_UPDATE_PICTURE_ON_LOGIN: true
      ENABLE_OAUTH_ID_TOKEN_COOKIE: false
      OAUTH_CLIENT_INFO_ENCRYPTION_KEY: ${OPENWEBUI_OIDC_CLIENT_INFO_ENCRYPTION_KEY}
      OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: ${OPENWEBUI_OIDC_SESSION_TOKEN_ENCRYPTION_KEY}
      OAUTH_CLIENT_ID: ${OPENWEBUI_OIDC_ID}
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OIDC_SECRET}
      OPENID_PROVIDER_URL: https://auth.server.${DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_PROVIDER_NAME: Authentik
      OAUTH_USERNAME_CLAIM: preferred_username
      OAUTH_EMAIL_CLAIM: email
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: homelab-admins
      DATABASE_URL: postgresql://${OPENWEBUI_PG_USER}:${OPENWEBUI_PG_PASS}@open_webui_db:5432/${OPENWEBUI_PG_DB}
      DATABASE_ENABLE_SESSION_SHARING: true
      REDIS_URL: redis://:${OPENWEBUI_VALKEY_PASS}@open_webui_valkey:6379/0
      REDIS_SOCKET_CONNECT_TIMEOUT: 5
      ENABLE_WEBSOCKET_SUPPORT: true
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://:${OPENWEBUI_VALKEY_PASS}@open_webui_valkey:6379/0
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - open_webui_private_net
      - ollama_public_net
      - traefik_public_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.open_webui.entrypoints=websecure
      - traefik.http.routers.open_webui.rule=Host(`open-webui.server.${DOMAIN}`)
      - traefik.http.services.open_webui.loadbalancer.server.port=8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open_webui_pgvector:
    image: docker.io/pgvector/pgvector:0.8.2-pg18
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    environment:
      POSTGRES_DB: ${OPENWEBUI_PGVECTOR_DB}
      POSTGRES_USER: ${OPENWEBUI_PGVECTOR_USER}
      POSTGRES_PASSWORD: ${OPENWEBUI_PGVECTOR_PASS}
    volumes:
      - open_webui_pgvector_data:/var/lib/postgresql/data
    networks:
      - open_webui_private_net

  open_webui_db:
    image: docker.io/library/postgres:18.3-alpine3.23
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    environment:
      POSTGRES_DB: ${OPENWEBUI_PG_DB}
      POSTGRES_USER: ${OPENWEBUI_PG_USER}
      POSTGRES_PASSWORD: ${OPENWEBUI_PG_PASS}
    volumes:
      - open_webui_db_data:/var/lib/postgresql/data
    networks:
      - open_webui_private_net

  open_webui_valkey:
    image: docker.io/valkey/valkey:9.0.3-alpine
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD
        - valkey-cli
        - -a
        - $${OPENWEBUI_VALKEY_PASS}
        - ping
      timeout: 5s
    environment:
      VALKEY_EXTRA_FLAGS: --requirepass ${OPENWEBUI_VALKEY_PASS}
    networks:
      - open_webui_private_net

volumes:
  open_webui_data:
  open_webui_pgvector_data:
  open_webui_db_data:

networks:
  open_webui_private_net:
    internal: false
