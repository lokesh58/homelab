services:
  traefik:
    image: docker.io/library/traefik:3.6.10
    restart: unless-stopped
    command:
      # === Entry Points: web (http redirect) ===
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # === Entry Points: websecure (https) ===
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=server.${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.server.${DOMAIN}
      - --entrypoints.websecure.http.middlewares=crowdsec@file
      # === Certificate Resolver: LetsEncrypt ===
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=${TRAEFIK_LE_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # === Docker Provider ===
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker_socket_proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public_net
      # === File Provider (for dynamic configuration) ===
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # === Metrics (Prometheus) ===
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --entrypoints.metrics.address=:8082
      # === Logging ===
      - --log.level=INFO
      # === Access Logs (for CrowdSec) ===
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.bufferingsize=100
      - --accesslog.format=json
      # === Experimental Plugins ===
      - --experimental.plugins.crowdsec_bouncer_traefik_plugin.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec_bouncer_traefik_plugin.version=v1.5.1
    ports:
      - 80:80/tcp
      - 443:443/tcp
    environment:
      CF_DNS_API_TOKEN: ${TRAEFIK_CF_DNS_API_TOKEN}
      CROWDSEC_LAPI_KEY: ${TRAEFIK_CROWDSEC_LAPI_KEY}
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      traefik_private_net:
      traefik_public_net:
        ipv4_address: 192.168.32.254
      docker_socket_proxy_public_net:
      crowdsec_public_net:
    labels:
      - 'socket-proxy.allow.get=/v1\..{1,2}/(version|containers/.*|events.*)'
      - 'socket-proxy.allow.head=/_ping'

volumes:
  letsencrypt:
  traefik_logs:

networks:
  traefik_private_net:
    internal: false
  traefik_public_net:
    name: traefik_public_net
    internal: true
    ipam:
      config:
        - subnet: 192.168.32.0/24
