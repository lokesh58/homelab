services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.35.4-alpine
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
    environment:
      WEBSOCKET_ENABLED: true
      PUSH_ENABLED: true
      PUSH_RELAY_URI: https://api.bitwarden.eu
      PUSH_IDENTITY_URI: https://identity.bitwarden.eu
      PUSH_INSTALLATION_ID: ${VAULTWARDEN_PUSH_INSTALLATION_ID}
      PUSH_INSTALLATION_KEY: ${VAULTWARDEN_PUSH_INSTALLATION_KEY}
      DOMAIN: https://vw.server.${DOMAIN}
      SENDS_ALLOWED: true
      TRASH_AUTO_DELETE_DAYS: 30
      SIGNUPS_ALLOWED: false
      INVITATIONS_ALLOWED: true
      INVITATION_ORG_NAME: Vaultwarden
      ORG_EVENTS_ENABLED: true
      EVENTS_DAYS_RETAIN: 365
      ORG_CREATION_USERS: ${VAULTWARDEN_ORG_CREATION_USERS}
      EXPERIMENTAL_CLIENT_FEATURE_FLAGS: inline-menu-positioning-improvements,inline-menu-totp,ssh-agent,ssh-key-vault-item,pm-25373-windows-biometrics-v2,export-attachments
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: vaultwarden@${DOMAIN}
      SMTP_FROM_NAME: Vaultwarden
      SMTP_SECURITY: ${SMTP_SECURITY}
    networks:
      - vaultwarden_private_net
      - traefik_public_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.rule=Host(`vw.server.${DOMAIN}`)
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

volumes:
  vaultwarden_data:

networks:
  vaultwarden_private_net:
    internal: false
