services:
  vaultwarden:
    image: vaultwarden/server:1.35.3-alpine
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
    environment:
      WEBSOCKET_ENABLED: true
      PUSH_ENABLED: true
      PUSH_RELAY_BASE_URI: https://push.bitwarden.eu
      PUSH_IDENTITY_URI: https://identity.bitwarden.eu
      PUSH_INSTALLATION_ID: ${VAULTWARDEN_PUSH_INSTALLATION_ID}
      PUSH_INSTALLATION_KEY: ${VAULTWARDEN_PUSH_INSTALLATION_KEY}
      DOMAIN: https://vw.${DOMAIN}
      SENDS_ALLOWED: true
      TRASH_AUTO_DELETE_DAYS: 30
      SIGNUPS_ALLOWED: false
      INVITATIONS_ALLOWED: true
      INVITATION_ORG_NAME: Vaultwarden
      ORG_EVENTS_ENABLED: true
      EVENTS_DAYS_RETAIN: 365
      EXPERIMENTAL_CLIENT_FEATURE_FLAGS: inline-menu-positioning-improvements,inline-menu-totp,ssh-agent,ssh-key-vault-item,pm-25373-windows-biometrics-v2,export-attachments
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: vaultwarden@${DOMAIN}
      SMTP_FROM_NAME: Vaultwarden
      SMTP_SECURITY: ${SMTP_SECURITY}
    networks:
      - vaultwarden_net
      - traefik_proxy
    labels:
      - traefik.enable=true
      # Main Router (Public/App access)
      - traefik.http.routers.vaultwarden.entrypoints=websecure,websecure_public
      - traefik.http.routers.vaultwarden.rule=Host(`vw.${DOMAIN}`)
      - traefik.http.routers.vaultwarden.service=vaultwarden
      # Admin Router (Protected by Authentik)
      - traefik.http.routers.vaultwarden-admin.entrypoints=websecure
      - traefik.http.routers.vaultwarden-admin.rule=Host(`vw.${DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.vaultwarden-admin.middlewares=authentik_auth@file
      - traefik.http.routers.vaultwarden-admin.service=vaultwarden
      # Service Definition
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

volumes:
  vaultwarden_data:

networks:
  vaultwarden_net:
    internal: false
