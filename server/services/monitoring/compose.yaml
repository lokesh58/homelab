services:
  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
      - traefik_proxy

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.internal.${DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.rule=Host(`grafana.internal.${DOMAIN}`)
      - traefik.http.routers.grafana.middlewares=authentik_auth@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

networks:
  monitoring_net:
    name: monitoring_net
    internal: true
  traefik_proxy:
    external: true

volumes:
  prometheus_data:
  grafana_data:
