services:
  headplane:
    image: ghcr.io/tale/headplane:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/headplane/config.yaml:ro
      - headplane_data:/var/lib/headplane
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.headplane.entrypoints=websecure
      - traefik.http.routers.headplane.rule=Host(`headplane.internal.${DOMAIN}`)
      - traefik.http.routers.headplane.middlewares=authentik_auth@file
      - traefik.http.services.headplane.loadbalancer.server.port=3000

networks:
  traefik_proxy:
    external: true

volumes:
  headplane_data:

