services:
  prometheus_agent:
    image: docker.io/prom/prometheus:v3.10.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus-agent.yaml
      - --enable-feature=agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${PUID}:${PGID}"
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus-agent.yaml:/etc/prometheus/prometheus-agent.yaml:ro
    networks:
      - prometheus_agent_private_net
      - traefik_public_net
      - headscale_public_net
      - crowdsec_public_net

networks:
  prometheus_agent_private_net:
    internal: true
