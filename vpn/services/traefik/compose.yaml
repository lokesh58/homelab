services:
  traefik:
    image: docker.io/library/traefik:3.6.10
    restart: unless-stopped
    command:
      # === Entry Points: web_public (http redirect) ===
      - --entrypoints.web_public.address=:8080
      - --entrypoints.web_public.http.redirections.entryPoint.to=websecure_public
      - --entrypoints.web_public.http.redirections.entryPoint.scheme=https
      - --entrypoints.web_public.http.redirections.entrypoint.permanent=true
      # === Entry Points: websecure_public (https) ===
      - --entrypoints.websecure_public.address=:8443
      - --entrypoints.websecure_public.http.tls=true
      - --entrypoints.websecure_public.http.tls.certresolver=le
      - --entrypoints.websecure_public.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure_public.http.tls.domains[0].sans=*.${DOMAIN}
      - --entrypoints.websecure_public.http.tls.domains[1].main=*.vpn.${DOMAIN}
      - --entrypoints.websecure_public.http.middlewares=crowdsec@file
      # === Entry Points: web_private (http redirect) ===
      - --entrypoints.web_public.address=:80
      - --entrypoints.web_public.http.redirections.entryPoint.to=websecure_private
      - --entrypoints.web_public.http.redirections.entryPoint.scheme=https
      - --entrypoints.web_public.http.redirections.entrypoint.permanent=true
      # === Entry Points: websecure_private (https) ===
      - --entrypoints.websecure_private.address=:443
      - --entrypoints.websecure_private.http.tls=true
      - --entrypoints.websecure_private.http.tls.certresolver=le
      - --entrypoints.websecure_private.http.middlewares=crowdsec@file
      # === Certificate Resolver: LetsEncrypt ===
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=${TRAEFIK_LE_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # === Docker Provider ===
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker_socket_proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public_net
      # === File Provider (for dynamic configuration) ===
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # === Metrics (Prometheus) ===
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --entrypoints.metrics.address=:8082
      # === Logging ===
      - --log.level=INFO
      # === Access Logs (for CrowdSec) ===
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.bufferingsize=100
      - --accesslog.format=json
      # === Experimental Plugins ===
      - --experimental.plugins.crowdsec_bouncer_traefik_plugin.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec_bouncer_traefik_plugin.version=v1.5.1
    ports:
      - 80:80/tcp
      - 443:443/tcp
      - 8080:8080/tcp
      - 8443:8443/tcp
    environment:
      CF_DNS_API_TOKEN: ${TRAEFIK_CF_DNS_API_TOKEN}
      CROWDSEC_LAPI_KEY: ${TRAEFIK_CROWDSEC_LAPI_KEY}
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - traefik_private_net
      - traefik_public_net
      - docker_socket_proxy_public_net
      - crowdsec_public_net
    labels:
      # Allow docker socket access by proxy
      - 'socket-proxy.allow.get=/v1\..{1,2}/(version|containers/.*|events.*)'
      - 'socket-proxy.allow.head=/_ping'
      # Expose traefik metrics
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik-metrics.entrypoints=websecure_private'
      - 'traefik.http.routers.traefik-metrics.rule=Host(`traefik-metrics.vpn.${DOMAIN}`)'
      - 'traefik.http.routers.traefik-metrics.service=prometheus@internal'

volumes:
  letsencrypt:
  traefik_logs:

networks:
  traefik_private_net:
    internal: false
  traefik_public_net:
    name: traefik_public_net
    internal: true
