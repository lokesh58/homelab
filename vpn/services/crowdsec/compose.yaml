services:
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:v1.7.6-debian
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/http-dos
      - BOUNCER_KEY_TRAEFIK=${TRAEFIK_CROWDSEC_LAPI_KEY}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - /var/log/journal:/run/log/journal:ro
      - traefik_logs:/var/log/traefik:ro
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - crowdsec_private_net
      - crowdsec_public_net

networks:
  crowdsec_private_net:
    internal: false
  crowdsec_public_net:
    internal: true

volumes:
  crowdsec_config:
  crowdsec_db:
