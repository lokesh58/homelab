user              nginx;
worker_processes  auto;
pid               /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# TCP/UDP Stream Configuration
stream {
    # Log format optimized for TCP stream analysis
    log_format tcp_stream_log '$remote_addr [$time_local] '
                              '$protocol $status $bytes_sent $bytes_received '
                              '$session_time';

    access_log /dev/stdout tcp_stream_log;

    upstream homelab_http {
        server 10.13.13.2:8080;
    }

    upstream homelab_https {
        server 10.13.13.2:8443;
    }

    server {
        listen 80;
        proxy_pass homelab_http;
        proxy_protocol on;
    }

    server {
        listen 443;
        proxy_pass homelab_https;
        proxy_protocol on;
    }
}
