name: custom/nginx-stream-logs
description: "Parse Nginx TCP stream logs"
filter: "evt.Parsed.program == 'nginx-stream'"
onsuccess: next_stage
pattern_syntax:
  NGINX_STREAM: '%{IP:remote_addr} \[%{HTTPDATE:time_local}\] %{WORD:protocol} %{NUMBER:status} %{NUMBER:bytes_sent} %{NUMBER:bytes_received} %{NUMBER:session_time}'
nodes:
  - grok:
      pattern: "^%{NGINX_STREAM}$"
      apply_on: message
      statics:
        - meta: source_ip
          expression: "evt.Parsed.remote_addr"
        - meta: time_local
          expression: "evt.Parsed.time_local"
        - meta: protocol
          expression: "evt.Parsed.protocol"
        - meta: status
          expression: "evt.Parsed.status"
