# Headscale ACL Policy
# Documentation: https://headscale.net/stable/ref/acls/
#
# SECURITY: This file is mounted read-only in the container.
# Even if the VPS is compromised, ACLs cannot be modified without
# SSH access to change this file and restart the container.

# Tag owners - who can assign which tags
# First user to register becomes the admin
tagOwners:
  tag:homelab:
    - autogroup:owner
  tag:personal:
    - autogroup:owner
  tag:server:
    - autogroup:owner
  tag:family:
    - autogroup:owner

# Access Control Lists
# Default: deny all, then allow specific flows
acls:
  # Owner (you) can access everything
  - action: accept
    src:
      - autogroup:owner
    dst:
      - "*:*"

  # Personal devices can access homelab services
  - action: accept
    src:
      - tag:personal
    dst:
      - tag:homelab:*
      - tag:server:*

  # Family devices can access homelab services
  - action: accept
    src:
      - tag:family
    dst:
      - tag:homelab:*

  # Personal devices can reach each other (file sharing, etc.)
  - action: accept
    src:
      - tag:personal
    dst:
      - tag:personal:*

  # Homelab/servers can reach personal/family devices (push notifications, etc.)
  - action: accept
    src:
      - tag:homelab
      - tag:server
    dst:
      - tag:personal:*
      - tag:family:*

# SSH settings (optional - for Tailscale SSH feature)
ssh: []
