# Required files:
#   - /run/secrets/oidc_client_secret (Google OAuth client secret)

# Server URL - OVERRIDE WITH ENV: HEADSCALE_SERVER_URL
server_url: https://vpn.example.com

# Listen address for the Headscale server
listen_addr: 0.0.0.0:8080

# gRPC settings (for CLI communication)
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

# Database configuration
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# Disable TLS - Caddy handles TLS termination
tls_cert_path: ""
tls_key_path: ""

# IP Prefixes for the Tailscale network
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# DERP configuration - Embedded relay server
# Provides relay for clients that can't establish direct connections
derp:
  server:
    # Enable embedded DERP relay
    enabled: true
    region_id: 999
    region_code: "homelab"
    region_name: "Homelab DERP"
    # Only allow authenticated clients
    verify_clients: true
    # STUN for NAT traversal - OVERRIDE WITH ENV: HEADSCALE_DERP_SERVER_STUN_LISTEN_ADDR
    stun_listen_addr: "0.0.0.0:3478"
    # VPS public IP - OVERRIDE WITH ENV: HEADSCALE_DERP_SERVER_IPV4
    ipv4: 0.0.0.0
    automatically_add_embedded_derp_region: true
  # Also use Tailscale's public DERP servers as fallback
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

# Disable automatic check for updates
disable_check_updates: true

# Ephemeral node inactivity timeout
ephemeral_node_inactivity_timeout: 30m

# Node key expiry - DISABLED
# Once registered, nodes stay connected forever until manually removed
node_key_expiry_disabled: true

# DNS configuration
dns:
  # MagicDNS disabled - nodes won't get automatic hostname.base_domain DNS names
  # Only custom extra_records will be provided
  magic_dns: false
  # Base domain not needed when magic_dns is false
  # base_domain: ts.example.com

  # Use device's local DNS settings instead of overriding them
  # Headscale will still provide extra_records for split DNS
  override_local_dns: false

  # Nameservers not needed when override_local_dns is false
  # Devices will use their own DNS settings
  # nameservers:
  #   global:
  #     - 1.1.1.1
  #     - 8.8.8.8

  # Extra DNS records - loaded from external file (not in git)
  # Create /var/lib/headscale/extra_records.json with your domain
  # This file is mounted from the host and not committed to git
  # Format: [{"name": "*.yourdomain.com", "type": "A", "value": "100.64.0.1"}]
  extra_records_path: /var/lib/headscale/extra_records.json

# Log settings
log:
  level: info
  format: text

# Unix socket for CLI
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# ACL Policy - DISABLED
# When no policy is configured, Headscale allows all traffic by default
# This is suitable for trusted family/personal networks
# To enable ACLs later, set mode to "file" and provide a path
policy:
  mode: ""
  path: ""

# OIDC Configuration - Google
# Create OAuth credentials at: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: https://vpn.<YOUR_DOMAIN>/oidc/callback
oidc:
  issuer: "https://accounts.google.com"
  # OVERRIDE WITH ENV: HEADSCALE_OIDC_CLIENT_ID
  client_id: "placeholder"
  # Client secret loaded from Docker secret
  client_secret_path: /run/secrets/oidc_client_secret
  # OVERRIDE WITH ENV: HEADSCALE_OIDC_ALLOWED_DOMAINS (comma-separated? or use allowed_users)
  # For single user, use allowed_users instead
  allowed_users: []
  allowed_domains: []
