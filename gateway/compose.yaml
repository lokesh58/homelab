name: homelab_gateway

services:
  traefik:
    image: docker.io/library/traefik:3.6
    restart: unless-stopped
    command:
      # === Entry Points: web (http redirect) ===
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # === Entry Points: websecure (https) ===
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=le
      # === Certificate Resolver: LetsEncrypt ===
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # === Docker Provider ===
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=headscale_net
      # === Metrics (Prometheus) ===
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --entrypoints.metrics.address=:8082
      # === Logging ===
      - --log.level=INFO
      # === Access Logs (for CrowdSec) ===
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.bufferingsize=100
      - --accesslog.format=json
    ports:
      - 80:80/tcp
      - 443:443/tcp
      - 8082:8082/tcp # for traefik metrics
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - headscale_net

  headscale:
    image: docker.io/headscale/headscale:0.28.0
    restart: unless-stopped
    command: serve
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
    ports:
      - 3478:3478/udp # for STUN
      - 9090:9090/tcp # for metrics
    networks:
      - headscale_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.headscale.rule=Host(`vpn.${DOMAIN}`)
      - traefik.http.routers.headscale.entrypoints=websecure
      - traefik.http.routers.headscale.tls.certresolver=le
      - traefik.http.services.headscale.loadbalancer.server.port=8080

  headplane:
    image: ghcr.io/tale/headplane:0.6.2
    restart: unless-stopped
    depends_on:
      - headscale
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headplane_data:/var/lib/headplane
    networks:
      - headscale_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.headplane.rule=Host(`vpn.internal.${DOMAIN}`)
      - traefik.http.routers.headplane.entrypoints=websecure
      - traefik.http.routers.headplane.tls.certresolver=le
      - traefik.http.services.headplane.loadbalancer.server.port=3000

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:v1.7.6
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/http-dos
    volumes:
      - crowdsec_config:/etc/crowdsec
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
      - traefik_logs:/var/log/traefik:ro
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - crowdsec_net

networks:
  headscale_net:
  crowdsec_net:

volumes:
  letsencrypt:
  traefik_logs:
  headscale_data:
  headplane_data:
  crowdsec_config:
  crowdsec_db:
